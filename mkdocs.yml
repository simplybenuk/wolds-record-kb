site_name: Wolds Record Help
docs_dir: knowledge-base
site_description: End-user documentation for Wolds Record organisations and practitioners
site_url: https://help.woldsrecord.com/
repo_url: https://github.com/simplybenuk/wolds-record-kb
repo_name: simplybenuk/wolds-record-kb
edit_uri: edit/main/knowledge-base/
site_dir: site
strict: true

theme:
  name: material
  language: en
  # Inter is self-hosted from the app's pinned files, so no Google Fonts request.
  font: false
  logo: assets/brand/logo.png
  favicon: assets/brand/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/fonts.css
  - stylesheets/brand.css

extra:
  generator: false

copyright: >-
  &copy; Wolds Record ·
  <a href="https://app.woldsrecord.com/">Open the app</a> ·
  <a href="https://www.woldsrecord.com/">woldsrecord.com</a> ·
  <a href="mailto:support@woldsrecord.com">support@woldsrecord.com</a>

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.admonition
  - toc:
      permalink: true
  - tables

plugins:
  - search

nav:
  - Home: index.md
  - Product overview: product/overview.md
  - Getting started:
      - Sign in and account setup: getting-started/sign-in-and-account.md
      - Organisation onboarding: getting-started/organisation-onboarding.md
  - User guides:
      - Account and personal settings: user-guides/manage-profile.md
      - Onboarding: user-guides/onboarding.md
      - Dashboard and search: user-guides/dashboard-and-search.md
      - Clients and dogs: user-guides/clients-and-dogs.md
      - Create and manage cases: user-guides/create-and-manage-cases.md
      - Record sessions: user-guides/record-sessions.md
      - Vet reports: user-guides/vet-reports.md
      - Vet practices: user-guides/vet-practices.md
      - Calendar (beta): user-guides/calendar.md
      - Organisation settings and export: user-guides/organisation-settings-and-export.md
      - Common access and error messages: user-guides/common-access-and-error-messages.md
